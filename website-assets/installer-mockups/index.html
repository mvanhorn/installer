b{color:#f4f4f5}</style></head><body><main><h1>June Local installer mockups</h1>
<p>Faithful renders of the real installer UI. Regenerate with <code>capture.py</code>.</p><figure><img src="png/01-home.png" alt="Installer home"><figcaption><b>Installer home</b><br>June Local installer home. The header shows the version and build; the tiles are Install June Local, Install with your own CA, Back up, Restore and More.</figcaption></figure>
<figure><img src="png/02-basic-options.png" alt="Basic install options"><figcaption><b>Basic install options</b><br>Basic install: the oven name (default june) and the persistence option. The project CA is added to the oven's trust store and the factory messaging app stays in place.</figcaption></figure>
<figure><img src="png/03-basic-persistence.png" alt="Basic install with persistence"><figcaption><b>Basic install with persistence</b><br>Persistence selected: 'Keep June Local after a factory reset' stages the cook-modes, camera, light and messaging patches in /system so a factory reset keeps them.</figcaption></figure>
<figure><img src="png/04-custom-options.png" alt="Custom install options"><figcaption><b>Custom install options</b><br>Custom install with a per-home CA: the oven LAN IP and hostname. The hostname defaults to june.local.</figcaption></figure>
<figure><img src="png/05-connect-waiting.png" alt="Connect the oven (waiting)"><figcaption><b>Connect the oven (waiting)</b><br>Steps on the left, the USB/SW2 illustration on the right, and the oven-found box below. Waiting for RCM mode.</figcaption></figure>
<figure><img src="png/06-connect-found.png" alt="Oven found, 3 s auto-start"><figcaption><b>Oven found, 3 s auto-start</b><br>The oven is detected; the box counts down from 3 seconds and starts the install automatically. Back cancels the countdown.</figcaption></figure>
<figure><img src="png/07-installing.png" alt="Installing"><figcaption><b>Installing</b><br>Progress, elapsed time and the step tracker while the installer runs. The fan note explains that the fans spin up and stay fast.</figcaption></figure>
<figure><img src="png/08-success.png" alt="Install success + QR codes"><figcaption><b>Install success + QR codes</b><br>Success screen with the restart/shutdown buttons and QR codes for the oven status page, setup guide, CA certificate and companion app (phone access on).</figcaption></figure>
<figure><img src="png/09-backup-destination.png" alt="Backup destination"><figcaption><b>Backup destination</b><br>Choose the backup drive, folder and file name. The current boot USB is listed and marked as such.</figcaption></figure>
<figure><img src="png/10-restore-confirm.png" alt="Restore confirmation"><figcaption><b>Restore confirmation</b><br>Restore: choose the backup image and type RESTORE to confirm. The warning explains that the oven is overwritten.</figcaption></figure>
<figure><img src="png/11-phone-sheet.png" alt="Phone access"><figcaption><b>Phone access</b><br>Connect a phone: the QR code opens the same installer on the phone so jobs can be started and followed from there.</figcaption></figure></main></body></html>
