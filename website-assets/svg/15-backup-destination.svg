<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><rect width="1600" height="900" fill="#08090b"/><text x="64" y="86" font-family="DejaVu Sans, sans-serif" font-size="46" font-weight="700" fill="#f4f4f5" text-anchor="start" >Back up the oven · destination</text><text x="64" y="126" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#a1a1aa" text-anchor="start" >One 7.8 GB file; choose where it goes</text><rect x="1370" y="48" width="83" height="29" rx="14.5" fill="#2a2e35" stroke="#2a2e35" stroke-width="0" /><text x="1411.5" y="67" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#ffb04a" text-anchor="middle" >MOCKUP</text><circle cx="130" cy="210" r="16" fill="#ff7a2e"/><text x="130" y="216" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#160a04" text-anchor="middle" >1</text><text x="158" y="216" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#f4f4f5" text-anchor="start" >Drive</text><circle cx="340" cy="210" r="16" fill="#3a3f47"/><text x="340" y="216" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#160a04" text-anchor="middle" >2</text><text x="368" y="216" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#a1a1aa" text-anchor="start" >Connect oven</text><circle cx="550" cy="210" r="16" fill="#3a3f47"/><text x="550" y="216" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#160a04" text-anchor="middle" >3</text><text x="578" y="216" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#a1a1aa" text-anchor="start" >Back up</text><text x="130" y="310" font-family="DejaVu Sans, sans-serif" font-size="42" font-weight="300" fill="#f4f4f5" text-anchor="start" >Where should the backup go?</text><text x="130" y="360" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#a1a1aa" text-anchor="start" >The backup is one 7.8 GB file. This computer runs from memory, so you can unplug the</text><text x="130" y="391" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#a1a1aa" text-anchor="start" >boot stick and use another drive.</text><rect x="130" y="450" width="1340" height="90" rx="14" fill="#14171c" stroke="#2a2e35" stroke-width="1.5" /><circle cx="170" cy="495" r="12" fill="#4ade80"/><text x="200" y="502" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="400" fill="#f4f4f5" text-anchor="start" >Ventoy (current boot USB)</text><rect x="1120" y="472" width="97" height="28" rx="14.0" fill="#2a2e35" stroke="#2a2e35" stroke-width="0" /><text x="1168.5" y="490" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#4ade80" text-anchor="middle" >Boot USB</text><text x="1430" y="502" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#a1a1aa" text-anchor="end" >exFAT · 12.4 GB free</text><rect x="130" y="560" width="1340" height="90" rx="14" fill="#14171c" stroke="#2a2e35" stroke-width="1.5" /><circle cx="170" cy="605" r="12" fill="#ffb04a"/><text x="200" y="612" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="400" fill="#f4f4f5" text-anchor="start" >BackupUSB</text><rect x="1120" y="582" width="54" height="28" rx="14.0" fill="#2a2e35" stroke="#2a2e35" stroke-width="0" /><text x="1147.0" y="600" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#ffb04a" text-anchor="middle" >USB</text><text x="1430" y="612" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#a1a1aa" text-anchor="end" >exFAT · 28.1 GB free</text><rect x="130" y="690" width="650" height="70" rx="12" fill="#0f1115" stroke="#2a2e35" stroke-width="1.5" /><text x="160" y="733" font-family="DejaVu Sans Mono, monospace" font-size="21" font-weight="400" fill="#a1a1aa" text-anchor="start" >Folder (optional):  june-backups</text><rect x="810" y="690" width="660" height="70" rx="12" fill="#0f1115" stroke="#2a2e35" stroke-width="1.5" /><text x="840" y="733" font-family="DejaVu Sans Mono, monospace" font-size="21" font-weight="400" fill="#a1a1aa" text-anchor="start" >File name:  261005-1430.img</text><rect x="130" y="790" width="330" height="60" rx="12" fill="#ff7a2e" stroke="#2a2e35" stroke-width="1.5" /><text x="295" y="828" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#160a04" text-anchor="middle" >Next: connect the oven</text><text x="64" y="862" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#a1a1aa" text-anchor="start" >Leave at least 8 GB free. If the boot stick is full, swap in a second USB now — the live system is already in RAM.</text></svg>
