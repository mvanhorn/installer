<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><rect width="1600" height="900" fill="#08090b"/><text x="64" y="86" font-family="DejaVu Sans, sans-serif" font-size="46" font-weight="700" fill="#f4f4f5" text-anchor="start" >June Local on a Ventoy USB</text><text x="64" y="126" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#a1a1aa" text-anchor="start" >Download → create the stick → boot → install or back up</text><rect x="64" y="210" width="270" height="300" rx="16" fill="#14171c" stroke="#2a2e35" stroke-width="1.5" /><rect x="64" y="210" width="7" height="300" rx="3.5" fill="#7cc4f2"/><circle cx="104" cy="250" r="24" fill="#7cc4f2"/><text x="104" y="258" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#160a04" text-anchor="middle" >1</text><text x="144" y="260" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#f4f4f5" text-anchor="start" >Download</text><text x="88" y="322" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >Ventoy from ventoy.net</text><text x="88" y="349" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >and the latest</text><text x="88" y="376" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >june-local-live.iso.</text><text x="88" y="403" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >Verify the SHA256.</text><line x1="342" y1="360" x2="360" y2="360" stroke="#7cc4f2" stroke-width="4" stroke-linecap="round"/><path d="M 360 360 l -14 -9 M 360 360 l -14 9" stroke="#7cc4f2" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="364" y="210" width="270" height="300" rx="16" fill="#14171c" stroke="#2a2e35" stroke-width="1.5" /><rect x="364" y="210" width="7" height="300" rx="3.5" fill="#ff7a2e"/><circle cx="404" cy="250" r="24" fill="#ff7a2e"/><text x="404" y="258" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#160a04" text-anchor="middle" >2</text><text x="444" y="260" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#f4f4f5" text-anchor="start" >Create the stick</text><text x="388" y="322" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >Install Ventoy to a 16</text><text x="388" y="349" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >GB+ USB. MBR, keep the</text><text x="388" y="376" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >exFAT partition label</text><text x="388" y="403" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >Ventoy.</text><line x1="642" y1="360" x2="660" y2="360" stroke="#ff7a2e" stroke-width="4" stroke-linecap="round"/><path d="M 660 360 l -14 -9 M 660 360 l -14 9" stroke="#ff7a2e" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="664" y="210" width="270" height="300" rx="16" fill="#14171c" stroke="#2a2e35" stroke-width="1.5" /><rect x="664" y="210" width="7" height="300" rx="3.5" fill="#ffb04a"/><circle cx="704" cy="250" r="24" fill="#ffb04a"/><text x="704" y="258" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#160a04" text-anchor="middle" >3</text><text x="744" y="260" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#f4f4f5" text-anchor="start" >Copy the files</text><text x="688" y="322" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >june-local-live.iso at</text><text x="688" y="349" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >the root, plus</text><text x="688" y="376" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >ventoy/ventoy.json.</text><text x="688" y="403" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >Leave ~8 GB free.</text><line x1="942" y1="360" x2="960" y2="360" stroke="#ffb04a" stroke-width="4" stroke-linecap="round"/><path d="M 960 360 l -14 -9 M 960 360 l -14 9" stroke="#ffb04a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="964" y="210" width="270" height="300" rx="16" fill="#14171c" stroke="#2a2e35" stroke-width="1.5" /><rect x="964" y="210" width="7" height="300" rx="3.5" fill="#4ade80"/><circle cx="1004" cy="250" r="24" fill="#4ade80"/><text x="1004" y="258" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#160a04" text-anchor="middle" >4</text><text x="1044" y="260" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#f4f4f5" text-anchor="start" >Boot the laptop</text><text x="988" y="322" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >Handle Secure Boot, pick</text><text x="988" y="349" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >the USB, then choose the</text><text x="988" y="376" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >graphical installer.</text><line x1="1242" y1="360" x2="1260" y2="360" stroke="#4ade80" stroke-width="4" stroke-linecap="round"/><path d="M 1260 360 l -14 -9 M 1260 360 l -14 9" stroke="#4ade80" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="1264" y="210" width="270" height="300" rx="16" fill="#14171c" stroke="#2a2e35" stroke-width="1.5" /><rect x="1264" y="210" width="7" height="300" rx="3.5" fill="#fbbf24"/><circle cx="1304" cy="250" r="24" fill="#fbbf24"/><text x="1304" y="258" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#160a04" text-anchor="middle" >5</text><text x="1344" y="260" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#f4f4f5" text-anchor="start" >Install or back up</text><text x="1288" y="322" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >The live system runs</text><text x="1288" y="349" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >from RAM. Logs go to</text><text x="1288" y="376" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >june-logs, certs to</text><text x="1288" y="403" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >june-certs.</text><rect x="64" y="570" width="1472" height="220" rx="16" fill="#14171c" stroke="#2a2e35" stroke-width="1.5" /><rect x="64" y="570" width="7" height="220" rx="3.5" fill="#e05252"/><text x="90" y="616.8" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" fill="#f4f4f5" text-anchor="start" >The project-specific rules</text><text x="90" y="656.8" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >Keep the Ventoy label; never FAT32 (the oven backup is ~7.3 GB); leave ~8 GB free; do not create a Ventoy persistence partition; the</text><text x="90" y="684.8" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >two boot menus are expected.</text><text x="64" y="862" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#a1a1aa" text-anchor="start" >Project July · June Local installer</text></svg>
