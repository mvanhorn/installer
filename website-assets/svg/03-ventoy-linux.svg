<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><rect width="1600" height="900" fill="#08090b"/><text x="64" y="86" font-family="DejaVu Sans, sans-serif" font-size="46" font-weight="700" fill="#f4f4f5" text-anchor="start" >Install Ventoy on Linux</text><text x="64" y="126" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#a1a1aa" text-anchor="start" >Whole-disk install; never pick a partition</text><rect x="1370" y="48" width="83" height="29" rx="14.5" fill="#2a2e35" stroke="#2a2e35" stroke-width="0" /><text x="1411.5" y="67" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#ffb04a" text-anchor="middle" >MOCKUP</text><rect x="120" y="190" width="1360" height="430" rx="14" fill="#050607" stroke="#2a2e35" stroke-width="1.5" /><text x="142" y="224" font-family="DejaVu Sans Mono, monospace" font-size="19" font-weight="400" fill="#4ade80" text-anchor="start" >$ sudo apt install dosfstools exfatprogs</text><text x="142" y="254" font-family="DejaVu Sans Mono, monospace" font-size="19" font-weight="400" fill="#4ade80" text-anchor="start" >$ lsblk -o NAME,SIZE,MODEL,TRAN,MOUNTPOINTS</text><text x="142" y="284" font-family="DejaVu Sans Mono, monospace" font-size="19" font-weight="400" fill="#f4f4f5" text-anchor="start" >  sda    32G  USB 3.0  usb   /media/user/Ventoy</text><text x="142" y="314" font-family="DejaVu Sans Mono, monospace" font-size="19" font-weight="400" fill="#4ade80" text-anchor="start" >$ sudo sh Ventoy2Disk.sh -i /dev/sda        # MBR</text><text x="142" y="344" font-family="DejaVu Sans Mono, monospace" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" ># add -s for Secure Boot support</text><text x="142" y="374" font-family="DejaVu Sans Mono, monospace" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" ># use -g only if you specifically need GPT</text><text x="142" y="404" font-family="DejaVu Sans Mono, monospace" font-size="19" font-weight="400" fill="#4ade80" text-anchor="start" >$ # the installer erases the USB and creates:</text><text x="142" y="434" font-family="DejaVu Sans Mono, monospace" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >#   /dev/sda1  VTOYEFI  32M  FAT</text><text x="142" y="464" font-family="DejaVu Sans Mono, monospace" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >#   /dev/sda2  Ventoy  29G   exFAT</text><rect x="120" y="660" width="640" height="160" rx="16" fill="#14171c" stroke="#2a2e35" stroke-width="1.5" /><rect x="120" y="660" width="7" height="160" rx="3.5" fill="#fbbf24"/><text x="140" y="698.4" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#f4f4f5" text-anchor="start" >If mkfs.vfat is missing</text><text x="140" y="738.4" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >Install dosfstools and exfatprogs (or exfat-utils on</text><text x="140" y="766.4" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >older distros).</text><rect x="800" y="660" width="680" height="160" rx="16" fill="#14171c" stroke="#2a2e35" stroke-width="1.5" /><rect x="800" y="660" width="7" height="160" rx="3.5" fill="#4ade80"/><text x="820" y="698.4" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#f4f4f5" text-anchor="start" >Keep the label</text><text x="820" y="738.4" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >The default label is Ventoy. The installer finds the stick</text><text x="820" y="766.4" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >by that label.</text><text x="64" y="862" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#a1a1aa" text-anchor="start" >Use the whole disk (/dev/sdX). If you point Ventoy at a partition, you can destroy the wrong filesystem.</text></svg>
