<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><rect width="1600" height="900" fill="#08090b"/><text x="64" y="86" font-family="DejaVu Sans, sans-serif" font-size="46" font-weight="700" fill="#f4f4f5" text-anchor="start" >Backups and the live RAM system</text><text x="64" y="126" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#a1a1aa" text-anchor="start" >The boot USB can be swapped for a backup drive</text><rect x="90" y="200" width="440" height="300" rx="16" fill="#14171c" stroke="#2a2e35" stroke-width="1.5" /><rect x="90" y="200" width="7" height="300" rx="3.5" fill="#7cc4f2"/><text x="116" y="246.8" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" fill="#f4f4f5" text-anchor="start" >Live system</text><text x="116" y="286.8" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >The June Local installer runs from</text><text x="116" y="314.8" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >RAM (toram). After boot, the boot</text><text x="116" y="342.8" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >USB is no longer required.</text><rect x="580" y="200" width="440" height="300" rx="16" fill="#14171c" stroke="#2a2e35" stroke-width="1.5" /><rect x="580" y="200" width="7" height="300" rx="3.5" fill="#ff7a2e"/><text x="606" y="246.8" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" fill="#f4f4f5" text-anchor="start" >Swap if needed</text><text x="606" y="286.8" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >Unplug the Ventoy stick and plug in</text><text x="606" y="314.8" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >a second USB for the oven backup.</text><text x="606" y="342.8" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >Wait for the installer to say it is</text><text x="606" y="370.8" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >safe.</text><rect x="1070" y="200" width="440" height="300" rx="16" fill="#14171c" stroke="#2a2e35" stroke-width="1.5" /><rect x="1070" y="200" width="7" height="300" rx="3.5" fill="#4ade80"/><text x="1096" y="246.8" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" fill="#f4f4f5" text-anchor="start" >Use the same stick</text><text x="1096" y="286.8" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >If the Ventoy stick has ≥ 8 GB free,</text><text x="1096" y="314.8" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >the installer lists it as Ventoy</text><text x="1096" y="342.8" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >(current boot USB) and can write the</text><text x="1096" y="370.8" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >backup there.</text><rect x="90" y="560" width="1420" height="230" rx="16" fill="#14171c" stroke="#2a2e35" stroke-width="1.5" /><text x="130" y="615" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#f4f4f5" text-anchor="start" >Backup target list (example)</text><circle cx="150" cy="659" r="9" fill="#4ade80"/><text x="180" y="665" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400" fill="#f4f4f5" text-anchor="start" >Ventoy (current boot USB)</text><text x="1420" y="665" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#a1a1aa" text-anchor="end" >exFAT · 12.4 GB free</text><circle cx="150" cy="719" r="9" fill="#ffb04a"/><text x="180" y="725" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400" fill="#f4f4f5" text-anchor="start" >BackupUSB</text><text x="1420" y="725" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#a1a1aa" text-anchor="end" >exFAT · 28.1 GB free</text><text x="64" y="862" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#a1a1aa" text-anchor="start" >One backup is ~7.3 GB and takes 15–30 minutes at typical USB speeds. Logs go to june-logs/; certs go to june-certs/.</text></svg>
