<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><rect width="1600" height="900" fill="#08090b"/><text x="64" y="86" font-family="DejaVu Sans, sans-serif" font-size="46" font-weight="700" fill="#f4f4f5" text-anchor="start" >Basic vs custom install</text><text x="64" y="126" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#a1a1aa" text-anchor="start" >Pick the recommended path unless you need a per-home CA</text><rect x="90" y="200" width="680" height="420" rx="16" fill="#14171c" stroke="#2a2e35" stroke-width="1.5" /><rect x="90" y="200" width="7" height="420" rx="3.5" fill="#ff7a2e"/><text x="116" y="250.0" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="700" fill="#f4f4f5" text-anchor="start" >Install June Local</text><text x="116" y="290.0" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >Recommended. Adds the project CA to the oven&#x27;s trust store</text><text x="116" y="318.0" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >and keeps the factory app. Install the same CA on the</text><text x="116" y="346.0" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >phone; then the June app and Home Assistant pair normally.</text><rect x="830" y="200" width="680" height="420" rx="16" fill="#14171c" stroke="#2a2e35" stroke-width="1.5" /><rect x="830" y="200" width="7" height="420" rx="3.5" fill="#ffb04a"/><text x="856" y="250.0" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="700" fill="#f4f4f5" text-anchor="start" >Install with your own CA</text><text x="856" y="290.0" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >Alternative. Creates a private certificate authority on the</text><text x="856" y="318.0" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >USB, signs a certificate for the oven&#x27;s address, and gives</text><text x="856" y="346.0" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >you a CA file to install on the phone. Use it if you want a</text><text x="856" y="374.0" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >per-home CA.</text><rect x="90" y="660" width="1420" height="120" rx="16" fill="#14171c" stroke="#2a2e35" stroke-width="1.5" /><text x="130" y="710" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" fill="#f4f4f5" text-anchor="start" >Persistence option</text><text x="130" y="750" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#a1a1aa" text-anchor="start" >Off by default. Turn it on only if you want the no-pin patch to survive a factory reset; it stores the patched app in /system.</text><text x="64" y="862" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#a1a1aa" text-anchor="start" >Most users should choose the recommended basic install.</text></svg>
