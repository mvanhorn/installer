<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><rect width="1600" height="900" fill="#08090b"/><text x="64" y="86" font-family="DejaVu Sans, sans-serif" font-size="46" font-weight="700" fill="#f4f4f5" text-anchor="start" >Copy the ISO and the config</text><text x="64" y="126" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#a1a1aa" text-anchor="start" >Root of the Ventoy partition is the simplest layout</text><rect x="1370" y="48" width="83" height="29" rx="14.5" fill="#2a2e35" stroke="#2a2e35" stroke-width="0" /><text x="1411.5" y="67" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#ffb04a" text-anchor="middle" >MOCKUP</text><rect x="100" y="170" width="700" height="52" rx="16" fill="#1d2128" stroke="#2a2e35" stroke-width="1.5" /><rect x="100" y="206" width="700" height="16" fill="#1d2128"/><circle cx="124" cy="196" r="7" fill="#ff5f57"/><circle cx="148" cy="196" r="7" fill="#febc2e"/><circle cx="172" cy="196" r="7" fill="#28c840"/><text x="450.0" y="204" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="600" fill="#f4f4f5" text-anchor="middle" >Ventoy (E:) — file manager</text><rect x="130" y="250" width="640" height="500" rx="14" fill="#14171c" stroke="#2a2e35" stroke-width="1.5" /><circle cx="165" cy="294" r="10" fill="#ff7a2e"/><text x="195" y="300" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#f4f4f5" text-anchor="start" >june-local-live.iso</text><text x="560" y="300" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#a1a1aa" text-anchor="end" >1.4 GB</text><circle cx="165" cy="364" r="10" fill="#ffb04a"/><text x="195" y="370" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#f4f4f5" text-anchor="start" >ventoy/</text><text x="560" y="370" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#a1a1aa" text-anchor="end" >folder</text><circle cx="165" cy="434" r="10" fill="#7cc4f2"/><text x="195" y="440" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#f4f4f5" text-anchor="start" >june-logs/</text><text x="560" y="440" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#a1a1aa" text-anchor="end" >created at install</text><circle cx="165" cy="504" r="10" fill="#4ade80"/><text x="195" y="510" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#f4f4f5" text-anchor="start" >june-certs/</text><text x="560" y="510" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#a1a1aa" text-anchor="end" >created at install</text><rect x="840" y="170" width="660" height="580" rx="14" fill="#050607" stroke="#2a2e35" stroke-width="1.5" /><text x="870" y="220" font-family="DejaVu Sans Mono, monospace" font-size="24" font-weight="700" fill="#f4f4f5" text-anchor="start" >ventoy/ventoy.json</text><text x="870" y="280" font-family="DejaVu Sans Mono, monospace" font-size="21" font-weight="400" fill="#ffb04a" text-anchor="start" >{</text><text x="870" y="318" font-family="DejaVu Sans Mono, monospace" font-size="21" font-weight="400" fill="#ffb04a" text-anchor="start" >  &quot;control&quot;: [</text><text x="870" y="356" font-family="DejaVu Sans Mono, monospace" font-size="21" font-weight="400" fill="#ffb04a" text-anchor="start" >    { &quot;VTOY_DEFAULT_MENU_MODE&quot;: &quot;0&quot; },</text><text x="870" y="394" font-family="DejaVu Sans Mono, monospace" font-size="21" font-weight="400" fill="#ffb04a" text-anchor="start" >    { &quot;VTOY_FILT_DOT_UNDERSCORE_FILE&quot;: &quot;1&quot; },</text><text x="870" y="432" font-family="DejaVu Sans Mono, monospace" font-size="21" font-weight="400" fill="#ffb04a" text-anchor="start" >    { &quot;VTOY_MENU_TIMEOUT&quot;: &quot;3&quot; },</text><text x="870" y="470" font-family="DejaVu Sans Mono, monospace" font-size="21" font-weight="400" fill="#ffb04a" text-anchor="start" >    { &quot;VTOY_DEFAULT_IMAGE&quot;:</text><text x="870" y="508" font-family="DejaVu Sans Mono, monospace" font-size="21" font-weight="400" fill="#ffb04a" text-anchor="start" >      &quot;/june-local-live.iso&quot; }</text><text x="870" y="546" font-family="DejaVu Sans Mono, monospace" font-size="21" font-weight="400" fill="#ffb04a" text-anchor="start" >  ]</text><text x="870" y="584" font-family="DejaVu Sans Mono, monospace" font-size="21" font-weight="400" fill="#ffb04a" text-anchor="start" >}</text><text x="870" y="700" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#a1a1aa" text-anchor="start" >If the ISO lives in /ISO/, use</text><text x="870" y="728" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#a1a1aa" text-anchor="start" >/ISO/june-local-live.iso and optionally set</text><text x="870" y="756" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#a1a1aa" text-anchor="start" >VTOY_DEFAULT_SEARCH_ROOT.</text><text x="64" y="862" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#a1a1aa" text-anchor="start" >The default image is selected after 3 seconds; the June Local menu then appears.</text></svg>
