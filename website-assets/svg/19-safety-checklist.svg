<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><rect width="1600" height="900" fill="#08090b"/><text x="64" y="86" font-family="DejaVu Sans, sans-serif" font-size="46" font-weight="700" fill="#f4f4f5" text-anchor="start" >Before you press the final button</text><text x="64" y="126" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#a1a1aa" text-anchor="start" >A short safety checklist</text><rect x="90" y="200" width="680" height="520" rx="16" fill="#14171c" stroke="#2a2e35" stroke-width="1.5" /><rect x="90" y="200" width="7" height="520" rx="3.5" fill="#4ade80"/><text x="116" y="251.6" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="700" fill="#f4f4f5" text-anchor="start" >Do</text><circle cx="130" cy="294" r="5" fill="#4ade80"/><text x="150" y="300" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#f4f4f5" text-anchor="start" >Use a USB 3 port on the computer itself, not a</text><text x="150" y="328" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#f4f4f5" text-anchor="start" >hub.</text><circle cx="130" cy="368" r="5" fill="#4ade80"/><text x="150" y="374" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#f4f4f5" text-anchor="start" >Keep the oven powered and connected for the</text><text x="150" y="402" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#f4f4f5" text-anchor="start" >whole job.</text><circle cx="130" cy="442" r="5" fill="#4ade80"/><text x="150" y="448" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#f4f4f5" text-anchor="start" >Wait for the success screen before unplugging</text><text x="150" y="476" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#f4f4f5" text-anchor="start" >anything.</text><circle cx="130" cy="516" r="5" fill="#4ade80"/><text x="150" y="522" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#f4f4f5" text-anchor="start" >Let the oven fans spin fast; that is normal.</text><circle cx="130" cy="590" r="5" fill="#4ade80"/><text x="150" y="596" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#f4f4f5" text-anchor="start" >Copy the logs from june-logs/ if you need</text><text x="150" y="624" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#f4f4f5" text-anchor="start" >support.</text><rect x="830" y="200" width="680" height="520" rx="16" fill="#14171c" stroke="#2a2e35" stroke-width="1.5" /><rect x="830" y="200" width="7" height="520" rx="3.5" fill="#e05252"/><text x="856" y="251.6" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="700" fill="#f4f4f5" text-anchor="start" >Don&#x27;t</text><circle cx="870" cy="294" r="5" fill="#e05252"/><text x="890" y="300" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#f4f4f5" text-anchor="start" >Do not unplug the oven during an install or</text><text x="890" y="328" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#f4f4f5" text-anchor="start" >restore.</text><circle cx="870" cy="368" r="5" fill="#e05252"/><text x="890" y="374" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#f4f4f5" text-anchor="start" >Do not use FAT32 for the backup drive.</text><circle cx="870" cy="442" r="5" fill="#e05252"/><text x="890" y="448" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#f4f4f5" text-anchor="start" >Do not rename the Ventoy partition.</text><circle cx="870" cy="516" r="5" fill="#e05252"/><text x="890" y="522" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#f4f4f5" text-anchor="start" >Do not close up the oven before testing it.</text><circle cx="870" cy="590" r="5" fill="#e05252"/><text x="890" y="596" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#f4f4f5" text-anchor="start" >Do not power off the laptop while the job is</text><text x="890" y="624" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#f4f4f5" text-anchor="start" >running.</text><text x="64" y="862" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#a1a1aa" text-anchor="start" >The installer warns before every destructive step. Nothing changes until you press the final button.</text></svg>
