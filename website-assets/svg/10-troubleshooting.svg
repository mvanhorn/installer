<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><rect width="1600" height="900" fill="#08090b"/><text x="64" y="86" font-family="DejaVu Sans, sans-serif" font-size="46" font-weight="700" fill="#f4f4f5" text-anchor="start" >Troubleshooting quick cards</text><text x="64" y="126" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#a1a1aa" text-anchor="start" >The problems users hit while making the stick</text><rect x="90" y="190" width="440" height="240" rx="16" fill="#14171c" stroke="#2a2e35" stroke-width="1.5" /><rect x="90" y="190" width="7" height="240" rx="3.5" fill="#fbbf24"/><text x="110" y="227.6" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#f4f4f5" text-anchor="start" >mkfs.vfat: command not found</text><text x="110" y="267.6" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >Linux: install dosfstools and</text><text x="110" y="295.6" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >exfatprogs (or exfat-utils), then</text><text x="110" y="323.6" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >rerun Ventoy2Disk.sh.</text><rect x="570" y="190" width="440" height="240" rx="16" fill="#14171c" stroke="#2a2e35" stroke-width="1.5" /><rect x="570" y="190" width="7" height="240" rx="3.5" fill="#7cc4f2"/><text x="590" y="227.6" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#f4f4f5" text-anchor="start" >Ventoy does not list the ISO</text><text x="590" y="267.6" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >Put the ISO on the large exFAT Ventoy</text><text x="590" y="295.6" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >partition, not the 32 MB VTOYEFI</text><text x="590" y="323.6" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >partition. Check the .iso extension</text><text x="590" y="351.6" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >and re-plug.</text><rect x="1050" y="190" width="440" height="240" rx="16" fill="#14171c" stroke="#2a2e35" stroke-width="1.5" /><rect x="1050" y="190" width="7" height="240" rx="3.5" fill="#4ade80"/><text x="1070" y="227.6" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#f4f4f5" text-anchor="start" >Stick is not offered as a backup target</text><text x="1070" y="267.6" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >Keep the Ventoy label, use exFAT/NTFS</text><text x="1070" y="295.6" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >(not FAT32), leave free space, and</text><text x="1070" y="323.6" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >make sure it is writable. Otherwise</text><text x="1070" y="351.6" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >use a second USB.</text><rect x="90" y="470" width="440" height="240" rx="16" fill="#14171c" stroke="#2a2e35" stroke-width="1.5" /><rect x="90" y="470" width="7" height="240" rx="3.5" fill="#ff7a2e"/><text x="110" y="507.6" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#f4f4f5" text-anchor="start" >Secure Boot verification error</text><text x="110" y="547.6" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >Enroll Ventoy&#x27;s key with MokManager or</text><text x="110" y="575.6" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >disable Secure Boot in the firmware.</text><rect x="570" y="470" width="440" height="240" rx="16" fill="#14171c" stroke="#2a2e35" stroke-width="1.5" /><rect x="570" y="470" width="7" height="240" rx="3.5" fill="#e05252"/><text x="590" y="507.6" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#f4f4f5" text-anchor="start" >No bootable device</text><text x="590" y="547.6" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >Check the boot order, try the other</text><text x="590" y="575.6" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >USB entry (UEFI vs Legacy), and</text><text x="590" y="603.6" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >confirm both Ventoy partitions exist.</text><rect x="1050" y="470" width="440" height="240" rx="16" fill="#14171c" stroke="#2a2e35" stroke-width="1.5" /><rect x="1050" y="470" width="7" height="240" rx="3.5" fill="#ffb04a"/><text x="1070" y="507.6" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#f4f4f5" text-anchor="start" >Very slow backup</text><text x="1070" y="547.6" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >Use a USB 3 port and stick. The oven</text><text x="1070" y="575.6" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >eMMC reads at roughly 8–10 MB/s, so a</text><text x="1070" y="603.6" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >full backup takes 15–30 minutes.</text><text x="64" y="862" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#a1a1aa" text-anchor="start" >The June Local menu is the second menu; Ventoy is the first. Both are expected.</text></svg>
