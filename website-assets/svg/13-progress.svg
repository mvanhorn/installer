<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><rect width="1600" height="900" fill="#08090b"/><text x="64" y="86" font-family="DejaVu Sans, sans-serif" font-size="46" font-weight="700" fill="#f4f4f5" text-anchor="start" >While the job runs</text><text x="64" y="126" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#a1a1aa" text-anchor="start" >Keep the oven connected and powered</text><rect x="1370" y="48" width="83" height="29" rx="14.5" fill="#2a2e35" stroke="#2a2e35" stroke-width="0" /><text x="1411.5" y="67" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#ffb04a" text-anchor="middle" >MOCKUP</text><text x="130" y="240" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#a1a1aa" text-anchor="start" >Installing June Local</text><text x="130" y="340" font-family="DejaVu Sans, sans-serif" font-size="96" font-weight="300" fill="#f4f4f5" text-anchor="start" >42%</text><text x="130" y="400" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#ffb04a" text-anchor="start" >Writing to the oven · estimating</text><rect x="130" y="440" width="1340" height="26" rx="13" fill="#23272e" stroke="#2a2e35" stroke-width="1.5" /><rect x="130" y="440" width="560" height="26" rx="13" fill="#ff7a2e" stroke="#2a2e35" stroke-width="1.5" /><text x="130" y="510" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#f4f4f5" text-anchor="start" >3.2 of 7.8 GiB at 9.4 MB/s</text><text x="130" y="545" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#a1a1aa" text-anchor="start" >This can take about two minutes for an install; a backup or restore takes 15–30 minutes.</text><rect x="130" y="600" width="1340" height="70" rx="12" fill="#241417" stroke="#4a2226" stroke-width="1.5" /><text x="170" y="645" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400" fill="#ffb4b4" text-anchor="start" >Keep the oven connected and powered. Don&#x27;t unplug anything.</text><circle cx="200" cy="730" r="14" fill="#4ade80"/><text x="222" y="737" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#f4f4f5" text-anchor="start" >Prepare</text><circle cx="450" cy="730" r="14" fill="#4ade80"/><text x="472" y="737" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#f4f4f5" text-anchor="start" >Connect oven</text><circle cx="700" cy="730" r="14" fill="#ff7a2e"/><text x="722" y="737" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#f4f4f5" text-anchor="start" >Write image</text><circle cx="950" cy="730" r="14" fill="#3a3f47"/><text x="972" y="737" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >Verify</text><circle cx="1200" cy="730" r="14" fill="#3a3f47"/><text x="1222" y="737" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >Finish</text><text x="64" y="862" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#a1a1aa" text-anchor="start" >The details panel shows the live installer log; the log is also saved to june-logs/ on the USB.</text></svg>
