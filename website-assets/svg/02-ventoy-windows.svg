nt-weight="700" fill="#f4f4f5" text-anchor="start" >Result</text><text x="940" y="718.4" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >VTOYEFI · 32 MB + Ventoy · exFAT</text><text x="64" y="862" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#a1a1aa" text-anchor="start" >Do not format or rename the large partition; the June Local installer looks for the Ventoy label.</text></svg>
