<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><rect width="1600" height="900" fill="#08090b"/><text x="64" y="86" font-family="DejaVu Sans, sans-serif" font-size="46" font-weight="700" fill="#f4f4f5" text-anchor="start" >Secure Boot</text><text x="64" y="126" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#a1a1aa" text-anchor="start" >Enroll Ventoy&#x27;s key, or disable Secure Boot for the install</text><rect x="1370" y="48" width="83" height="29" rx="14.5" fill="#2a2e35" stroke="#2a2e35" stroke-width="0" /><text x="1411.5" y="67" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#ffb04a" text-anchor="middle" >MOCKUP</text><rect x="100" y="190" width="430" height="240" rx="16" fill="#14171c" stroke="#2a2e35" stroke-width="1.5" /><rect x="100" y="190" width="7" height="240" rx="3.5" fill="#7cc4f2"/><text x="126" y="236.0" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#f4f4f5" text-anchor="start" >1 · Is Secure Boot on?</text><text x="126" y="276.0" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >Check the firmware (BIOS/UEFI). If</text><text x="126" y="304.0" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >it is off, boot the USB normally.</text><rect x="590" y="190" width="430" height="240" rx="16" fill="#14171c" stroke="#2a2e35" stroke-width="1.5" /><rect x="590" y="190" width="7" height="240" rx="3.5" fill="#ff7a2e"/><text x="616" y="236.0" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#f4f4f5" text-anchor="start" >2 · Ventoy key</text><text x="616" y="276.0" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >Install Ventoy with Secure Boot</text><text x="616" y="304.0" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >Support, or choose the</text><text x="616" y="332.0" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >key-enrollment path below.</text><rect x="1080" y="190" width="420" height="240" rx="16" fill="#14171c" stroke="#2a2e35" stroke-width="1.5" /><rect x="1080" y="190" width="7" height="240" rx="3.5" fill="#fbbf24"/><text x="1106" y="236.0" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#f4f4f5" text-anchor="start" >3 · Or disable it</text><text x="1106" y="276.0" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >For a one-time installer laptop,</text><text x="1106" y="304.0" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >disabling Secure Boot is the</text><text x="1106" y="332.0" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" >simplest path.</text><rect x="100" y="480" width="1400" height="250" rx="14" fill="#050607" stroke="#2a2e35" stroke-width="1.5" /><text x="140" y="540" font-family="DejaVu Sans Mono, monospace" font-size="28" font-weight="700" fill="#f4f4f5" text-anchor="start" >MokManager on first boot</text><text x="140" y="610" font-family="DejaVu Sans Mono, monospace" font-size="22" font-weight="400" fill="#ffb04a" text-anchor="start" >Enroll key from disk</text><text x="140" y="644" font-family="DejaVu Sans Mono, monospace" font-size="22" font-weight="400" fill="#ffb04a" text-anchor="start" >→  VTOYEFI</text><text x="140" y="678" font-family="DejaVu Sans Mono, monospace" font-size="22" font-weight="400" fill="#ffb04a" text-anchor="start" >→  ENROLL_THIS_KEY_IN_MOKMANAGER.cer</text><text x="140" y="712" font-family="DejaVu Sans Mono, monospace" font-size="22" font-weight="400" fill="#ffb04a" text-anchor="start" >→  Continue  →  Yes  →  Reboot</text><rect x="1340" y="500" width="83" height="29" rx="14.5" fill="#2a2e35" stroke="#2a2e35" stroke-width="0" /><text x="1381.5" y="519" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#ffb04a" text-anchor="middle" >MOCKUP</text><text x="64" y="862" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#a1a1aa" text-anchor="start" >After MokManager enrollment the USB boots normally on Secure Boot machines. If you disabled Secure Boot, re-enable it after the install if needed.</text></svg>
