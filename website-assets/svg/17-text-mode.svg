<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><rect width="1600" height="900" fill="#08090b"/><text x="64" y="86" font-family="DejaVu Sans, sans-serif" font-size="46" font-weight="700" fill="#f4f4f5" text-anchor="start" >Basic text UI</text><text x="64" y="126" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#a1a1aa" text-anchor="start" >Fallback when the graphical interface cannot start</text><rect x="1370" y="48" width="83" height="29" rx="14.5" fill="#2a2e35" stroke="#2a2e35" stroke-width="0" /><text x="1411.5" y="67" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#ffb04a" text-anchor="middle" >MOCKUP</text><rect x="130" y="200" width="1340" height="560" rx="14" fill="#050607" stroke="#2a2e35" stroke-width="1.5" /><text x="152" y="234" font-family="DejaVu Sans Mono, monospace" font-size="19" font-weight="400" fill="#f4f4f5" text-anchor="start" >June Local installer</text><text x="152" y="264" font-family="DejaVu Sans Mono, monospace" font-size="19" font-weight="400" fill="#f4f4f5" text-anchor="start" ></text><text x="152" y="294" font-family="DejaVu Sans Mono, monospace" font-size="19" font-weight="400" fill="#f4f4f5" text-anchor="start" >  1) Install June Local</text><text x="152" y="324" font-family="DejaVu Sans Mono, monospace" font-size="19" font-weight="400" fill="#f4f4f5" text-anchor="start" >  2) Install with your own CA</text><text x="152" y="354" font-family="DejaVu Sans Mono, monospace" font-size="19" font-weight="400" fill="#f4f4f5" text-anchor="start" >  3) Back up the oven</text><text x="152" y="384" font-family="DejaVu Sans Mono, monospace" font-size="19" font-weight="400" fill="#f4f4f5" text-anchor="start" >  4) Restore a backup</text><text x="152" y="414" font-family="DejaVu Sans Mono, monospace" font-size="19" font-weight="400" fill="#f4f4f5" text-anchor="start" >  5) Exit installer and reboot</text><text x="152" y="444" font-family="DejaVu Sans Mono, monospace" font-size="19" font-weight="400" fill="#f4f4f5" text-anchor="start" ></text><text x="152" y="474" font-family="DejaVu Sans Mono, monospace" font-size="19" font-weight="400" fill="#f4f4f5" text-anchor="start" >Select an option [1-5]: _</text><text x="152" y="504" font-family="DejaVu Sans Mono, monospace" font-size="19" font-weight="400" fill="#f4f4f5" text-anchor="start" ></text><text x="152" y="534" font-family="DejaVu Sans Mono, monospace" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" ># Same jobs as the graphical UI.</text><text x="152" y="564" font-family="DejaVu Sans Mono, monospace" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" ># Arrow keys / number keys + Enter.</text><text x="152" y="594" font-family="DejaVu Sans Mono, monospace" font-size="19" font-weight="400" fill="#a1a1aa" text-anchor="start" ># Logs still go to june-logs/ on the USB.</text><rect x="130" y="790" width="1340" height="60" rx="16" fill="#14171c" stroke="#2a2e35" stroke-width="1.5" /><rect x="130" y="790" width="7" height="60" rx="3.5" fill="#ff7a2e"/><text x="170" y="830" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#a1a1aa" text-anchor="start" >Use this only if the graphical UI fails. The graphical installer is the normal path.</text></svg>
