<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><rect width="1600" height="900" fill="#08090b"/><text x="64" y="86" font-family="DejaVu Sans, sans-serif" font-size="46" font-weight="700" fill="#f4f4f5" text-anchor="start" >Put the oven in recovery mode</text><text x="64" y="126" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#a1a1aa" text-anchor="start" >Connect the USB cable, hold SW2, then power on</text><rect x="1370" y="48" width="83" height="29" rx="14.5" fill="#2a2e35" stroke="#2a2e35" stroke-width="0" /><text x="1411.5" y="67" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#ffb04a" text-anchor="middle" >MOCKUP</text><circle cx="130" cy="210" r="16" fill="#4ade80"/><text x="130" y="216" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#160a04" text-anchor="middle" >1</text><text x="158" y="216" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#a1a1aa" text-anchor="start" >Options</text><circle cx="340" cy="210" r="16" fill="#ff7a2e"/><text x="340" y="216" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#160a04" text-anchor="middle" >2</text><text x="368" y="216" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#f4f4f5" text-anchor="start" >Connect oven</text><circle cx="550" cy="210" r="16" fill="#3a3f47"/><text x="550" y="216" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#160a04" text-anchor="middle" >3</text><text x="578" y="216" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#a1a1aa" text-anchor="start" >Install</text><text x="130" y="300" font-family="DejaVu Sans, sans-serif" font-size="38" font-weight="300" fill="#f4f4f5" text-anchor="start" >Put the oven in recovery mode</text><rect x="130" y="350" width="620" height="420" rx="16" fill="#14171c" stroke="#2a2e35" stroke-width="1.5" /><rect x="170" y="400" width="200" height="140" rx="10" fill="#1d2128" stroke="#2a2e35" stroke-width="1.5" /><text x="270" y="465" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#a1a1aa" text-anchor="middle" >computer</text><rect x="370" y="500" width="80" height="40" rx="8" fill="#1d2128" stroke="#2a2e35" stroke-width="1.5" /><text x="410" y="528" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#a1a1aa" text-anchor="middle" >USB</text><path d="M 450 520 C 520 520 540 470 590 470" stroke="#ff7a2e" stroke-width="5" fill="none" stroke-dasharray="10 8"/><rect x="560" y="370" width="150" height="280" rx="14" fill="#1d2128" stroke="#2a2e35" stroke-width="1.5" /><text x="635" y="405" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#a1a1aa" text-anchor="middle" >OVEN</text><circle cx="635" cy="470" r="18" fill="#ff7a2e"/><text x="720" y="476" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#f4f4f5" text-anchor="start" >SW2</text><circle cx="635" cy="560" r="18" fill="#ffb04a"/><text x="720" y="590" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#f4f4f5" text-anchor="start" >POWER</text><rect x="180" y="730" width="37" height="29" rx="14.5" fill="#ffb04a" stroke="#ffb04a" stroke-width="0" /><text x="198.5" y="749" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#160a04" text-anchor="middle" >1</text><rect x="700" y="430" width="37" height="29" rx="14.5" fill="#ffb04a" stroke="#ffb04a" stroke-width="0" /><text x="718.5" y="449" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#160a04" text-anchor="middle" >2</text><rect x="700" y="540" width="37" height="29" rx="14.5" fill="#ffb04a" stroke="#ffb04a" stroke-width="0" /><text x="718.5" y="559" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#160a04" text-anchor="middle" >3</text><text x="810" y="380" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400" fill="#f4f4f5" text-anchor="start" >1. Connect the oven to this computer with the USB cable.</text><text x="810" y="415" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#a1a1aa" text-anchor="start" >Use a port on the computer itself, not a hub.</text><text x="810" y="500" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400" fill="#f4f4f5" text-anchor="start" >2. Press and hold SW2 (force recovery) on the oven&#x27;s board.</text><text x="810" y="555" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400" fill="#a1a1aa" text-anchor="start" >3. Switch the oven&#x27;s power on and keep holding SW2</text><text x="810" y="585" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400" fill="#a1a1aa" text-anchor="start" >for about 10 seconds.</text><rect x="810" y="635" width="660" height="100" rx="14" fill="#1b2418" stroke="#31512c" stroke-width="1.5" /><text x="850" y="680" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" fill="#4ade80" text-anchor="start" >Oven found · RCM mode</text><text x="850" y="715" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#a1a1aa" text-anchor="start" >You can let go of SW2.</text><rect x="810" y="750" width="330" height="62" rx="12" fill="#ff7a2e" stroke="#2a2e35" stroke-width="1.5" /><text x="975" y="790" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#160a04" text-anchor="middle" >Install June Local</text><rect x="1170" y="750" width="170" height="62" rx="12" fill="#0f1115" stroke="#2a2e35" stroke-width="1.5" /><text x="1255" y="790" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#a1a1aa" text-anchor="middle" >Back</text><text x="64" y="862" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#a1a1aa" text-anchor="start" >Once it starts, the oven&#x27;s fans spin up and stay fast while it works. That is normal.</text></svg>
