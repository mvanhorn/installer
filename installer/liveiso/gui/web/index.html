<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#08090b">
<title>June Local Installer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2308090b'/%3E%3Crect x='7' y='9' width='18' height='14' rx='3' fill='none' stroke='%23ffc247' stroke-width='2.4'/%3E%3Cpath d='M11 13h10' stroke='%23ff7a2e' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect x="5" y="7" width="22" height="18" rx="4"/><path d="M10 12h12"/><circle cx="11" cy="19" r="1.4"/><circle cx="16" cy="19" r="1.4"/></svg>
      <div class="brand-text">
        <div class="brand-name">June Local</div>
        <div class="brand-sub" id="brand-sub">Installer</div>
      </div>
    </div>
    <div class="top-right">
      <div class="chip" id="oven-chip" role="status" aria-live="polite"></div>
      <button class="icon-btn" id="phone-btn" type="button" aria-label="Connect a phone" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4v-3"/></svg>
        <span class="icon-btn-label">Phone</span>
        <span class="badge" id="phone-badge" hidden></span>
      </button>
    </div>
  </header>
  <main class="main" id="main" tabindex="-1"></main>
  <div class="conn" id="conn" hidden>Reconnecting to the installer…</div>
</div>
<dialog class="sheet" id="sheet"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script src="app.js"></script>
</body>
</html>
